<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Launch Era | Lead Command Center</title><style>body{margin:0;background:#f1f6fa;color:#203c50;font:16px system-ui}header{padding:22px;background:white;border-bottom:1px solid #ddd}main{padding:24px;max-width:1150px;margin:auto}h1{font-size:38px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.column{background:#e3edf5;border-radius:16px;padding:14px;min-height:200px}.lead{background:white;border-radius:12px;padding:15px;margin:12px 0;cursor:pointer;box-shadow:0 2px 10px #ccd8e3}button{background:#487e9f;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}input,select{padding:10px;margin:6px;width:90%;border:1px solid #bbcbd6;border-radius:7px}dialog{border:0;border-radius:15px;padding:25px;box-shadow:0 15px 55px #789}@media(max-width:800px){.grid{display:flex;overflow:auto}.column{min-width:210px}}</style></head><body><header><strong>THE LAUNCH ERA · LEAD COMMAND CENTER</strong></header><main><h1>Your lead pipeline</h1><p>Demo workspace · Data is saved only in this browser. Do not enter real customer data.</p><button onclick="edit(-1)">+ Add lead</button><input id="search" placeholder="Search leads" oninput="render()"><div class="grid" id="board"></div></main><dialog id="dialog"><h2>Lead details</h2><form id="form"><label>Business<input name="business" required></label><label>Contact<input name="contact"></label><label>Stage<select name="stage"><option>New</option><option>Contacted</option><option>Follow-up</option><option>Won</option></select></label><label>Notes<input name="notes"></label><button>Save</button><button type="button" onclick="document.getElementById('dialog').close()">Cancel</button></form></dialog><script>const stages=['New','Contacted','Follow-up','Won'];let leads=JSON.parse(localStorage.getItem('tle_demo_leads')||'[]'),selected=-1;const $=id=>document.getElementById(id);function render(){let q=$('search').value.toLowerCase();$('board').replaceChildren(...stages.map(s=>{let col=document.createElement('section');col.className='column';let h=document.createElement('h3');h.textContent=s+' ('+leads.filter(x=>x.stage===s).length+')';col.append(h);leads.forEach((x,i)=>{if(x.stage!==s||!(x.business+' '+x.contact).toLowerCase().includes(q))return;let item=document.createElement('div');item.className='lead';item.textContent=x.business+' · '+x.contact;item.onclick=()=>edit(i);col.append(item)});return col}))}function edit(i){selected=i;let x=leads[i]||{business:'',contact:'',stage:'New',notes:''};for(let k of ['business','contact','stage','notes'])$('form').elements[k].value=x[k];$('dialog').showModal()}$('form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));if(selected<0)leads.push(x);else leads[selected]=x;localStorage.setItem('tle_demo_leads',JSON.stringify(leads));$('dialog').close();render()};render();</script></body></html>
