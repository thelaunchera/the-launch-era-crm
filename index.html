<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Launch Era | Lead Command Center</title><style>body{margin:0;background:#f2f7fb;color:#243d50;font:16px system-ui}header{padding:22px 5%;background:white;border-bottom:1px solid #dae5ec;display:flex;justify-content:space-between}main{max-width:1180px;margin:30px auto;padding:0 20px}h1{font-size:38px}button{background:#4985a8;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}input,select,textarea{padding:12px;margin:6px 0 16px;border:1px solid #c7d6e0;border-radius:9px;box-sizing:border-box;width:100%;font:inherit}label{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.lane{background:#e6eff5;border-radius:15px;padding:16px;min-height:220px}.lead,.panel{background:white;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 12px #cbd9e555}.lead{cursor:pointer}.muted{color:#687e90}.hidden{display:none}dialog{border:0;border-radius:16px;padding:25px;width:min(430px,90vw)}.danger{background:#ac5362}@media(max-width:800px){.grid{display:flex;overflow:auto}.lane{min-width:210px}}</style></head><body><header><b>THE LAUNCH ERA · LEAD COMMAND CENTER</b><button id="logout" class="hidden">Sign out</button></header><main><section id="auth" class="panel"><h1>Welcome to your workspace</h1><p>Sign in or create your business account.</p><form id="authForm"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="6" required autocomplete="current-password"></label><button type="submit" id="signin">Sign in</button> <button type="button" id="signup">Create account</button></form><p class="muted" id="authMessage"></p></section><section id="app" class="hidden"><h1>Your lead pipeline</h1><p class="muted" id="workspaceName"></p><section id="setup" class="panel hidden"><h2>Create your business workspace</h2><form id="workspaceForm"><input name="name" placeholder="Business name" required maxlength="120"><button>Create workspace</button></form></section><section id="pipeline" class="hidden"><button id="add">+ Add lead</button><input id="search" placeholder="Search leads"><div id="board" class="grid"></div></section></section><p id="message" role="status"></p></main><dialog id="editor"><form id="leadForm"><h2>Lead details</h2><label>Business<input name="business" required maxlength="120"></label><label>Contact<input name="contact" maxlength="120"></label><label>Email<input name="email" type="email"></label><label>Source<input name="source" maxlength="120"></label><label>Stage<select name="stage"><option>New</option><option>Contacted</option><option>Follow-up</option><option>Won</option></select></label><label>Next follow-up<input name="followup" type="date"></label><label>Notes<textarea name="notes" maxlength="4000"></textarea></label><button>Save</button> <button type="button" id="remove" class="danger">Delete</button> <button type="button" id="cancel">Cancel</button></form></dialog><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://bowacxhmjvrqixtwaikv.supabase.co','sb_publishable_0TueitFYiRF3rAEMLMT8-w_FvbvY0rB');
const $=id=>document.getElementById(id);let workspace=null,leads=[],editing=null;
const say=s=>$('message').textContent=s;
async function check(result){if(result.error)throw result.error;return result.data}
async function boot(){try{let {data:{user}}=await db.auth.getUser();$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(!user)return;let ws=await check(await db.from('tle_crm_workspaces').select('id,name').eq('created_by',user.id).order('created_at',{ascending:true}).limit(1));workspace=ws[0]||null;$('setup').classList.toggle('hidden',!!workspace);$('pipeline').classList.toggle('hidden',!workspace);if(workspace){$('workspaceName').textContent=workspace.name;await load()}}catch(e){say(e.message)}}
$('authForm').onsubmit=async e=>{e.preventDefault();try{let x=Object.fromEntries(new FormData(e.target));await check(await db.auth.signInWithPassword(x));$('authMessage').textContent='';await boot()}catch(e){$('authMessage').textContent=e.message}};
$('signup').onclick=async()=>{try{let x=Object.fromEntries(new FormData($('authForm')));await check(await db.auth.signUp(x));$('authMessage').textContent='Account created. Check your email for confirmation if required, then sign in.'}catch(e){$('authMessage').textContent=e.message}};
$('logout').onclick=async()=>{await db.auth.signOut();workspace=null;leads=[];await boot()};
$('workspaceForm').onsubmit=async e=>{e.preventDefault();try{let {data:{user}}=await db.auth.getUser();await check(await db.from('tle_crm_workspaces').insert({name:e.target.name.value,created_by:user.id}));await boot()}catch(err){say(err.message)}};
async function load(){try{leads=await check(await db.from('tle_crm_leads').select('id,business,contact,email,source,stage,followup,notes').eq('workspace_id',workspace.id).order('created_at',{ascending:false}));render()}catch(e){say(e.message)}}
function render(){const q=$('search').value.toLowerCase();$('board').replaceChildren(...['New','Contacted','Follow-up','Won'].map(stage=>{const lane=document.createElement('section');lane.className='lane';const h=document.createElement('h3');h.textContent=stage+' ('+leads.filter(x=>x.stage===stage).length+')';lane.append(h);leads.filter(x=>x.stage===stage&&(x.business+' '+(x.contact||'')).toLowerCase().includes(q)).forEach(x=>{const c=document.createElement('div');c.className='lead';const b=document.createElement('b');b.textContent=x.business;const p=document.createElement('p');p.textContent=(x.contact||'')+(x.followup?' · Follow-up '+x.followup:'');c.append(b,p);c.onclick=()=>edit(x);lane.append(c)});return lane}))}
$('search').oninput=render;
function edit(x){editing=x||null;for(const k of ['business','contact','email','source','stage','followup','notes'])$('leadForm').elements[k].value=x?.[k]|| (k==='stage'?'New':'');$('remove').classList.toggle('hidden',!x);$('editor').showModal()}
$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('editor').close();
$('leadForm').onsubmit=async e=>{e.preventDefault();try{let data=Object.fromEntries(new FormData(e.target));if(!data.followup)data.followup=null;data.workspace_id=workspace.id;if(editing)await check(await db.from('tle_crm_leads').update(data).eq('id',editing.id).eq('workspace_id',workspace.id));else await check(await db.from('tle_crm_leads').insert(data));$('editor').close();await load();say('Saved successfully')}catch(err){say(err.message)}};
$('remove').onclick=async()=>{if(!editing||!confirm('Delete this lead?'))return;try{await check(await db.from('tle_crm_leads').delete().eq('id',editing.id).eq('workspace_id',workspace.id));$('editor').close();await load()}catch(e){say(e.message)}};
boot();
</script></body></html>
