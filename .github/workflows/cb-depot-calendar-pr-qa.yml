name: CB Depot Legacy Calendar Safe PR QA
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/booking-calendar-motion.*"
      - "scripts/qa-booking-calendar-motion*.mjs"
      - "customer-crm/CALENDAR-MOTION-SPEC.md"
      - ".github/workflows/cb-depot-calendar-pr-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify real CB Depot handlers retained
        run: node scripts/qa-booking-calendar-motion.mjs
      - name: Browser smoke on synthetic fixtures only
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node scripts/qa-booking-calendar-motion-browser.mjs