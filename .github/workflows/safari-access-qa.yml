name: Safari Command Center Access QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke-ipad-access.mjs'
      - '.github/workflows/safari-access-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-signin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Validate live Safari-compatible Command Center access
        run: node scripts/smoke-ipad-access.mjs
      - name: Attach diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-command-center-safari-qa
          path: safari-*.png
          if-no-files-found: ignore
