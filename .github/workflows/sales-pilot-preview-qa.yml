name: Sales pilot: Maid Naturally branded preview QA
on:
  pull_request:
    paths:
      - 'sales-pilot/maid-naturally-conversion-preview.html'
      - 'sales-pilot/qa-maid-naturally.mjs'
      - '.github/workflows/sales-pilot-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branded-concept-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check concept on phone, tablet and desktop
        run: |
          mkdir -p sales-pilot/qa-artifacts
          node sales-pilot/qa-maid-naturally.mjs
      - name: Attach private review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maid-naturally-brand-match-qa
          path: sales-pilot/qa-artifacts/
          retention-days: 7
